# Sandbox egress: allowlisted package registries only.

http_port 3128

acl SSL_ports port 443
acl Safe_ports port 80 443
acl CONNECT method CONNECT
acl allowed_domains dstdomain "/etc/squid/allowed-domains.txt"

# Destinations checked after DNS resolution: an allowed name that resolves
# to a private, loopback, link-local, CGNAT or host address is refused
# (the host's Postgres/ClickHouse/RustFS listen on 0.0.0.0).
acl to_private dst 0.0.0.0/8 10.0.0.0/8 100.64.0.0/10 127.0.0.0/8 169.254.0.0/16 172.16.0.0/12 192.0.0.0/24 192.168.0.0/16 198.18.0.0/15 224.0.0.0/4 240.0.0.0/4
acl to_private dst ::1/128 fc00::/7 fe80::/10

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access deny to_private
http_access allow allowed_domains
http_access deny all

# No caching, no on-disk state.
cache deny all
pid_filename none
access_log stdio:/tmp/access.log
cache_log stdio:/dev/stderr
logfile_rotate 0
forwarded_for delete
