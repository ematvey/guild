services:
  # Default operating mode: the server uses the shared HOST services
  # (postgres on :5432 at /srv/postgres, ClickHouse on :8123 at
  # /srv/clickhouse, rustfs on :9950) via host.docker.internal — see
  # config.env. The full in-compose infra below (postgres/clickhouse/minio)
  # is the self-contained fallback: run with `--profile fullstack` and point
  # config.env back at the service names. Kept maintained, not used by
  # default, so tests and prod don't bootstrap their own copies.

  postgres:
    image: postgres:17
    profiles: ["fullstack"]
    environment:
      POSTGRES_USER: guild
      POSTGRES_PASSWORD: guild
      POSTGRES_DB: guild
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guild"]
      interval: 2s
      timeout: 3s
      retries: 30

  clickhouse:
    image: clickhouse/clickhouse-server:24
    profiles: ["fullstack"]
    volumes:
      - chdata:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio:
    image: minio/minio
    profiles: ["fullstack"]
    command: server /data
    environment:
      MINIO_ROOT_USER: guild
      MINIO_ROOT_PASSWORD: guild-secret
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio-init:
    image: minio/mc
    profiles: ["fullstack"]
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 guild guild-secret &&
      mc mb --ignore-existing local/guild
      "

  restate:
    image: docker.io/restatedev/restate:latest
    # Ingress stays internal (worker role talks to it over the compose
    # network); the admin/UI port is published for operators.
    ports:
      - "${GUILD_RESTATE_ADMIN_PORT:-9070}:9070"

  server:
    build:
      context: ../..
      dockerfile: Dockerfile
    ports:
      - "${GUILD_HTTP_PORT:-8080}:8080"
    env_file: config.env
    extra_hosts:
      # reach the host-published shared services (postgres/clickhouse/rustfs)
      - "host.docker.internal:host-gateway"
    volumes:
      - guild_data:/data
    depends_on:
      restate:
        condition: service_started

volumes:
  pgdata:
  chdata:
  miniodata:
  guild_data:
