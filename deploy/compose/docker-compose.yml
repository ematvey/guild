services:
  # Default operating mode: the server uses the shared HOST services
  # (postgres on :5432, ClickHouse on :8123, S3 on :9950) via
  # host.docker.internal — see
  # config.env. The full in-compose infra below (postgres/clickhouse/minio)
  # is the self-contained fallback: run with `--profile fullstack` and point
  # config.env back at the service names. Kept maintained, not used by
  # default, so tests and prod don't bootstrap their own copies.

  postgres:
    image: postgres:17
    profiles: ["fullstack"]
    environment:
      POSTGRES_USER: guild
      POSTGRES_PASSWORD: guild
      POSTGRES_DB: guild
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guild"]
      interval: 2s
      timeout: 3s
      retries: 30

  clickhouse:
    image: clickhouse/clickhouse-server:24
    profiles: ["fullstack"]
    volumes:
      - chdata:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio:
    image: minio/minio
    profiles: ["fullstack"]
    command: server /data
    environment:
      MINIO_ROOT_USER: guild
      MINIO_ROOT_PASSWORD: guild-secret
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio-init:
    image: minio/mc
    profiles: ["fullstack"]
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 guild guild-secret &&
      mc mb --ignore-existing local/guild
      "

  juicefs-init:
    # One-shot: the JuiceFS metadata lives in its own Postgres database
    # (guild_meta), separate from the app database. Uses the stack's
    # GUILD_DATABASE_URL credentials; the host dir prerequisite is
    # documented in docs/deploy-nuances.md.
    image: postgres:17
    restart: "no"
    env_file: ${GUILD_CONFIG_ENV:-config.env}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      GUILD_JUICE_META_DB: ${GUILD_JUICE_META_DB:-guild_meta}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        admin_url="$${GUILD_DATABASE_URL%/*}/postgres"
        for _ in $$(seq 1 60); do
          psql "$$admin_url" -tAc 'SELECT 1' >/dev/null 2>&1 && break
          sleep 1
        done
        psql "$$admin_url" -tAc 'SELECT 1' >/dev/null
        exists=$$(psql "$$admin_url" -tAc "SELECT 1 FROM pg_database WHERE datname='$$GUILD_JUICE_META_DB'")
        if [ "$$exists" != "1" ]; then
          psql "$$admin_url" -v ON_ERROR_STOP=1 -c "CREATE DATABASE \"$$GUILD_JUICE_META_DB\""
        fi

  juicefs:
    # JuiceFS sidecar: mounts the agent workspace volume in the host mount
    # namespace (the server, runner and sandbox containers all resolve the
    # host directory). pid: host + privileged are what let the entrypoint
    # nsenter into PID 1 and install the client on the host. Settings come
    # from config.env (GUILD_JUICE_* and the GUILD_S3_* fallbacks).
    image: ${GUILD_JUICE_IMAGE:-juicedata/mount:ce-v1.3.1}
    restart: unless-stopped
    pid: host
    privileged: true
    env_file: ${GUILD_CONFIG_ENV:-config.env}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    entrypoint: ["/usr/local/bin/guild-juicefs-entrypoint"]
    volumes:
      - ../juicefs/entrypoint.sh:/usr/local/bin/guild-juicefs-entrypoint:ro
    depends_on:
      juicefs-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "nsenter -t 1 -m -- stat -f -c %T /mnt/guild | grep -qi fuse"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s

  server:
    # The TS server (apps/server) is the only server: it serves the whole
    # public surface (HTTP + the hub WS upgrade) — gateway, chats/turns on
    # pi-durable, hub machine links, registry/releases, projects, teams,
    # admin, integrations, web UI. Deferred surfaces (routines, hooks,
    # internal) answer a clean 404. Host services (postgres/clickhouse/
    # rustfs) are external — no compose service deps.
    image: ${GUILD_TS_SERVER_IMAGE:-guild-server-ts:latest}
    build:
      context: ../..
      dockerfile: Dockerfile.server-ts
    restart: unless-stopped
    ports:
      - "${GUILD_HTTP_PORT:-8080}:8080"
    env_file: ${GUILD_CONFIG_ENV:-config.env}
    extra_hosts:
      # reach the host-published shared services (postgres/clickhouse/rustfs)
      - "host.docker.internal:host-gateway"
    environment:
      # Server-side tools run in gVisor sandboxes via the runner below
      # (GUILD_SANDBOX_RUNNER_TOKEN is shared through config.env).
      GUILD_SANDBOX_RUNNER_URL: http://sandbox-runner:8090
      # Agent workspaces (read-only for the file browser).
      GUILD_AGENT_WORKSPACE_ROOT: /workspaces
      GUILD_AGENT_WORKSPACE_WRITE_ROOT: /workspaces-write
    depends_on:
      juicefs:
        condition: service_healthy
        restart: true
    volumes:
      # GUILD_DATA_DIR: the server-side workspace sessions root
      # (workspaces/<org>/<name>) and plain-chat sandboxes (chats/<org>/<id>).
      - guild_data:/data
      # JuiceFS-backed agent workspaces: agents/<org>/<agent>, read-only.
      # The second mount is the write surface for delegation artifacts only.
      - guild_workspaces:/workspaces:ro
      - guild_workspaces:/workspaces-write

  sandbox-runner:
    # The only process holding the Docker socket: creates one gVisor
    # sandbox per workspace (runsc runtime, internal network, the workspace
    # subpath of guild_data mounted at /workspace) and bridges the server's
    # RPC connections to the agent inside. Never published. Same image as
    # the server, run as root for the socket. Discovers its compose project
    # from its own labels (volume <project>_guild_data, network
    # <project>_sandbox). Plan: docs/plans/2026-10-14-sandbox-runner-gvisor.md.
    image: ${GUILD_TS_SERVER_IMAGE:-guild-server-ts:latest}
    restart: unless-stopped
    user: "0:0"
    command: ["bun", "src/sandbox/runner/main.ts"]
    env_file: ${GUILD_CONFIG_ENV:-config.env}
    environment:
      GUILD_SANDBOX_IMAGE: ${GUILD_SANDBOX_IMAGE:-guild-sandbox:latest}
      # By address: Docker's embedded DNS does not work under gVisor, and
      # proxied clients never need DNS themselves (CONNECT carries the name).
      GUILD_SANDBOX_PROXY_URL: http://${GUILD_SANDBOX_EGRESS_IP:-10.213.0.2}:3128
      # Agent subpath dirs are created on the agent volume mounted here.
      GUILD_SANDBOX_AGENT_DIR: /workspaces
    depends_on:
      sandbox-image:
        condition: service_started
      juicefs:
        condition: service_healthy
        restart: true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Subpath dirs are created and handed to the sandbox uid here.
      - guild_data:/data
      # JuiceFS-backed agent workspaces: agents/<org>/<agent>, read-write.
      - guild_workspaces:/workspaces

  sandbox-image:
    # Build-only: `docker compose up --build` builds the sandbox image the
    # runner creates sandboxes from; the container itself exits at once.
    image: ${GUILD_SANDBOX_IMAGE:-guild-sandbox:latest}
    build:
      context: ../..
      dockerfile: Dockerfile.sandbox
    entrypoint: ["true"]
    restart: "no"

  egress:
    # The sandboxes' only way out: squid with a registry allowlist
    # (../sandbox/egress/allowed-domains.txt) and a deny for private and
    # host addresses after DNS resolution.
    image: ${GUILD_SANDBOX_EGRESS_IMAGE:-guild-sandbox-egress:latest}
    build:
      context: ../sandbox/egress
    restart: unless-stopped
    volumes:
      - ../sandbox/egress/allowed-domains.txt:/etc/squid/allowed-domains.txt:ro
    networks:
      default: {}
      sandbox:
        ipv4_address: ${GUILD_SANDBOX_EGRESS_IP:-10.213.0.2}

networks:
  # Sandboxes join only this network: no gateway, so no internet, host, or
  # compose service is reachable except the egress proxy.
  sandbox:
    internal: true
    # Explicit subnet (hosts with many compose projects exhaust Docker's
    # default pools); stacks sharing a host each pick their own.
    ipam:
      config: [{ subnet: "${GUILD_SANDBOX_SUBNET:-10.213.0.0/24}" }]

volumes:
  pgdata:
  chdata:
  miniodata:
  guild_data:
  # The JuiceFS mount, reached through the host directory the sidecar
  # mounts into. The bind source must exist before `docker compose up`
  # (docs/deploy-nuances.md §4b).
  guild_workspaces:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${GUILD_WORKSPACE_HOST_DIR:-/mnt/guild}
