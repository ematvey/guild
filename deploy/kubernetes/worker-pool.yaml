apiVersion: ate.dev/v1
kind: WorkerPool
metadata:
  name: guild-actor-workers
  namespace: guild-experiment
  labels:
    guild.dev/workload: sandbox
spec:
  replicas: 3
  workerImage: ghcr.io/agent-substrate/substrate/ateworker-gvisor:v1.0.1
  sandboxClasses:
    - name: gvisor
  template:
    resources:
      requests:
        cpu: 250m
        memory: 2Gi
      limits:
        cpu: "2"
        memory: 2Gi
