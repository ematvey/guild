apiVersion: ate.dev/v1
kind: WorkerPool
metadata:
  name: guild-actor-workers
  namespace: guild-experiment
  labels:
    guild.dev/workload: sandbox
spec:
  replicas: 3
  workerImage: ghcr.io/agent-substrate/substrate/ateworker-gvisor:v1.0.1
  sandboxClasses:
    - name: gvisor
  template:
    resources:
      requests:
        cpu: 250m
        memory: 2Gi
      limits:
        cpu: "2"
        memory: 2Gi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: guild-actor-worker-egress
  namespace: guild-experiment
spec:
  podSelector:
    matchLabels:
      ate.dev/worker-pool: guild-actor-workers
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ate-system
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
