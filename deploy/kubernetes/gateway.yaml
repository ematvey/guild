apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayParameters
metadata:
  name: guild-ai
  namespace: guild-experiment
spec:
  service:
    spec:
      type: ClusterIP
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: guild-ai
  namespace: guild-experiment
spec:
  gatewayClassName: agentgateway
  infrastructure:
    parametersRef:
      name: guild-ai
      group: agentgateway.dev
      kind: AgentgatewayParameters
  listeners:
    - name: ai
      port: 8080
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same
