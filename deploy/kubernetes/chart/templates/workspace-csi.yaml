---
apiVersion: v1
kind: Service
metadata:
  name: guild-workspace-csi
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: guild-workspace-csi
  ports:
    - port: 50051

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: guild-workspace-csi
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app: guild-workspace-csi
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ate-system
          podSelector:
            matchLabels:
              app: ate-api-server
      ports:
        - port: 50051

---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: guild-workspace-csi
  namespace: {{ .Release.Namespace }}
spec:
  {{- include "guild.workloadSpec" (list . "guild-workspace-csi" (include "guild.spec.guild-workspace-csi" .)) | nindent 2 }}

{{- $endpoint := printf "tcp://guild-workspace-csi.%s.svc.%s:50051" .Release.Namespace .Values.clusterDomain }}
{{- $driver := include "guild.workspaceDriver" . }}
{{- if .Release.IsUpgrade }}
  {{- with lookup "apps/v1" "DaemonSet" .Release.Namespace "guild-workspace-csi" }}
    {{- range .spec.template.spec.volumes }}
      {{- if and (eq .name "socket") (ne .hostPath.path (printf "/var/lib/kubelet/plugins/%s" $driver)) }}
        {{- fail "workspaceDriverName cannot change on an existing Guild release" }}
      {{- end }}
    {{- end }}
  {{- end }}
{{- end }}
{{- with lookup "ate.dev/v1" "CSIDriverConfig" "" $driver }}
  {{- if ne .spec.controllerEndpoint $endpoint }}
    {{- fail (printf "%s already points at a different endpoint; use a distinct workspaceDriverName or perform an explicit transfer" $driver) }}
  {{- end }}
{{- end }}
---
apiVersion: ate.dev/v1
kind: CSIDriverConfig
metadata:
  name: {{ $driver | quote }}
spec:
  driverName: {{ $driver | quote }}
  controllerEndpoint: {{ $endpoint | quote }}
