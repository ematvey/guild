# K3s config drop-in for the Agent Substrate pod certificate controller.
kube-apiserver-arg:
  - feature-gates=ClusterTrustBundle=true,PodCertificateRequest=true
  - runtime-config=certificates.k8s.io/v1beta1=true
kubelet-arg:
  - feature-gates=ClusterTrustBundle=true,ClusterTrustBundleProjection=true,PodCertificateRequest=true
