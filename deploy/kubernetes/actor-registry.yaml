apiVersion: v1
kind: Service
metadata:
  name: kind-registry
  namespace: ate-system
spec:
  selector:
    app: guild-actor-registry
  ports:
    - port: 5000
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: guild-actor-registry
  namespace: ate-system
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: guild-actor-registry
  namespace: ate-system
spec:
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: guild-actor-registry
  template:
    metadata:
      labels:
        app: guild-actor-registry
    spec:
      automountServiceAccountToken: false
      containers:
        - name: registry
          image: registry:3
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /v2/
              port: 5000
          volumeMounts:
            - name: images
              mountPath: /var/lib/registry
      volumes:
        - name: images
          persistentVolumeClaim:
            claimName: guild-actor-registry
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: guild-actor-registry
  namespace: ate-system
spec:
  podSelector:
    matchLabels:
      app: guild-actor-registry
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: atelet
      ports:
        - port: 5000
