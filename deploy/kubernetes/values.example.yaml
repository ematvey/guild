atespace: guild-prod
workspaceDriverName: workspace.csi.guild.prod

storage:
  applicationBucket: guild-prod
  workspaceClaim: guild-workspaces
  storageClass: replace-with-durable-rwx-class
  plainWorkspacesInData: true

images:
  server: registry.example.org/guild/server:replace-with-build
  curl-fetch: registry.example.org/guild/curl-fetch:replace-with-build
  adapter: registry.example.org/guild/substrate-adapter:replace-with-build
  csi: registry.example.org/guild/workspace-csi:replace-with-build
  # actor: registry.example.org/guild/sandbox@sha256:<published-digest>

ingress:
  host: guild.example.org
  className: nginx
  tlsSecret: guild-tls
