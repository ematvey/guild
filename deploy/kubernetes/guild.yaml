apiVersion: v1
kind: Service
metadata:
  name: guild
  namespace: guild-experiment
spec:
  selector:
    app: guild
  ports:
    - port: 8080
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: guild-data-dir
  namespace: guild-experiment
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: guild
  namespace: guild-experiment
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: guild
  template:
    metadata:
      labels:
        app: guild
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      initContainers:
        - name: postgres-ready
          image: postgres:17
          command: [/bin/sh, -ec, 'until pg_isready -h postgres -U guild -d guild; do sleep 2; done']
        - name: workspace-ready
          image: postgres:17
          command: [/bin/sh, -ec, 'until grep -q " /juicefs/volume .* - fuse.juicefs " /proc/self/mountinfo; do sleep 2; done']
          volumeMounts:
            - name: workspaces
              mountPath: /juicefs
              mountPropagation: HostToContainer
              readOnly: true
      containers:
        - name: server
          image: guild-k8s-server:experiment
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: guild-server
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: guild-data
                  key: postgres-password
            - name: GUILD_DATABASE_URL
              value: postgres://guild:$(POSTGRES_PASSWORD)@postgres:5432/guild
            - name: GUILD_BIND_ADDR
              value: 0.0.0.0:8080
            - name: GUILD_API_URL
              value: http://guild:8080
            - name: GUILD_AGENT_WORKSPACE_ROOT
              value: /juicefs/volume
            - name: GUILD_AGENT_WORKSPACE_WRITE_ROOT
              value: /juicefs/volume
            - name: GUILD_DATA_DIR
              value: /data
            - name: GUILD_CLICKHOUSE_URL
              value: http://clickhouse:8123
            - name: GUILD_CLICKHOUSE_USER
              value: guild
            - name: GUILD_CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: guild-data
                  key: clickhouse-password
            - name: GUILD_S3_URL
              value: http://rustfs:9000
            - name: GUILD_S3_BUCKET
              value: guild
            - name: GUILD_S3_ACCESS_KEY_ID
              value: GUILDEXPERIMENT
            - name: GUILD_S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: guild-data
                  key: rustfs-password
            - name: GUILD_AGENTGATEWAY_URL
              value: http://guild-ai:8080
            - name: GUILD_AGENTGATEWAY_ISSUER
              value: https://guild-agent-experiment.invalid
            - name: GUILD_AGENTGATEWAY_SIGNING_KEY_FILE
              value: /run/guild-agentgateway/signing.pem
            - name: GUILD_SANDBOX_RUNNER_URL
              value: http://guild-substrate:8090
            - name: GUILD_WORKER_MODE
              value: "on"
            - name: GUILD_WORKER_LIMIT
              value: "4"
            - name: GUILD_CURL_FETCH_URL
              value: http://curl-fetch:8080
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8080
          volumeMounts:
            - name: data
              mountPath: /data
            - name: workspaces
              mountPath: /juicefs
              mountPropagation: HostToContainer
            - name: agentgateway-signing
              mountPath: /run/guild-agentgateway
              readOnly: true
      volumes:
        - name: agentgateway-signing
          secret:
            secretName: guild-agentgateway-signing
            defaultMode: 0440
        - name: workspaces
          hostPath:
            path: /var/lib/guild-juicefs
            type: Directory
        - name: data
          persistentVolumeClaim:
            claimName: guild-data-dir
---
apiVersion: v1
kind: Service
metadata:
  name: curl-fetch
  namespace: guild-experiment
spec:
  selector:
    app: curl-fetch
  ports:
    - port: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: curl-fetch
  namespace: guild-experiment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: curl-fetch
  template:
    metadata:
      labels:
        app: curl-fetch
    spec:
      automountServiceAccountToken: false
      containers:
        - name: curl-fetch
          image: guild-k8s-curl-fetch:experiment
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
