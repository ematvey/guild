metadata:
  atespace: guild-experiment
  name: guild-rpc-probe-v2
workerSelector:
  matchLabels:
    guild.dev/workload: sandbox
containers:
  - name: sandbox
    image: ${GUILD_ACTOR_IMAGE}
    command: [/usr/local/bin/node, /opt/guild/actor.js]
    wakeupProbe:
      httpGet:
        path: /readyz
        port: 8080
resources:
  limits:
    cpuMillicores: 500
    memoryBytes: 536870912
snapshotConfig:
  preferredFidelity: SNAPSHOT_FIDELITY_MEMORY
