[workspace]
resolver = "2"
# default-members keeps `cargo test/check/build` off the Tauri desktop app:
# its webview dependency tree dominates compile time and it has no meaningful
# tests. Build it explicitly with `-p guild-desktop` when working on it.
default-members = [
    "crates/protocol",
    "crates/guild-core",
    "crates/app-server",
    "crates/server",
]
members = [
    "crates/protocol",
    "apps/desktop/src-tauri",
    "crates/guild-core",
    "crates/app-server",
    "crates/server",
    "crates/codex-execpolicy",
    "crates/codex-utils-absolute-path",
]

[workspace.package]
edition = "2021"
version = "0.5.11"
license = "Apache-2.0"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
axum = { version = "0.8", features = ["ws"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs", "trace", "cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "migrate"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
eventsource-stream = "0.2"
argon2 = "0.5"
aes-gcm = "0.10"
rand = "0.8"
rand_core = { version = "0.6", features = ["getrandom"] }
hex = "0.4"
sha2 = "0.10"
hmac = "0.12"
subtle = "2.6"
ed25519-dalek = { version = "2", features = ["rand_core"] }
jsonwebtoken = "10"
async-trait = "0.1"
futures = "0.3"
