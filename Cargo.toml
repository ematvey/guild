[workspace]
resolver = "2"
# default-members keeps `cargo test/check/build` off the Tauri desktop app:
# its webview dependency tree dominates compile time and it has no meaningful
# tests. Build it explicitly with `-p guild-desktop` when working on it.
default-members = [
    "crates/protocol",
    "crates/guild-core",
    "crates/app-server",
]
members = [
    "crates/protocol",
    "apps/desktop/src-tauri",
    "crates/guild-core",
    "crates/app-server",
]

[workspace.package]
edition = "2021"
version = "0.6.68"
license = "Apache-2.0"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
axum = { version = "0.8", features = ["ws"] }
uuid = { version = "1", features = ["v4", "v5", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
hex = "0.4"
sha2 = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core"] }
async-trait = "0.1"
futures = "0.3"
