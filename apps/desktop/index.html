<!doctype html>
<html lang="en">
  <head>
    <script>
      // set the theme class before first paint (default: dark)
      try {
        var t = localStorage.getItem("guild.theme") || "dark";
        var dark = t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
      } catch (e) { document.documentElement.classList.add("dark"); }
    </script>
    <script>
      // iOS Safari ignores user-scalable=no: block its page-zoom pinch
      // gestures directly, or a pinch leaves the page zoomed and pannable
      // horizontally (gesturestart/change are Safari-specific events).
      document.addEventListener("gesturestart", function (e) { e.preventDefault(); });
      document.addEventListener("gesturechange", function (e) { e.preventDefault(); });
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Guild</title>
      <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Guild" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
    // Unregister any service worker left over from an earlier build and
    // drop its caches.
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (rs) {
        for (const r of rs) r.unregister();
      });
      navigator.serviceWorker.getRegistration("/sw.js").then(function (r) {
        if (r) caches.keys().then(function (ks) {
          for (const k of ks) if (k.startsWith("guild-shell")) caches.delete(k);
        });
      });
    }
  </script>
</body>
</html>
