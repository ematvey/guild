<!doctype html>
<html lang="en">
  <head>
    <script>
      // set the theme class before first paint (default: dark)
      try {
        var t = localStorage.getItem("guild.theme") || "dark";
        var dark = t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
      } catch (e) { document.documentElement.classList.add("dark"); }
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Guild</title>
      <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Guild" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" href="/icon-192.png" type="image/png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
    // The PWA service worker was retired (2026-09-11): the app is
    // server-backed and always-online, the desktop app bundles its own
    // assets (no SW), and the SW's cached-shell fallback only complicated
    // deploys. One-time cleanup for browsers that still hold the old SW.
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (rs) {
        for (const r of rs) r.unregister();
      });
      navigator.serviceWorker.getRegistration("/sw.js").then(function (r) {
        if (r) caches.keys().then(function (ks) {
          for (const k of ks) if (k.startsWith("guild-shell")) caches.delete(k);
        });
      });
    }
  </script>
</body>
</html>
