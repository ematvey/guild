[package]
name = "guild-desktop"
version = "0.5.126"
edition = "2021"
license = "Apache-2.0"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools", "tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"
guild-app-server = { path = "../../../crates/app-server" }
dirs = "6"
sha2.workspace = true
hex.workspace = true
ed25519-dalek.workspace = true
anyhow.workspace = true
protocol = { path = "../../../crates/protocol" }
guild-core = { path = "../../../crates/guild-core" }
reqwest.workspace = true
futures.workspace = true
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
# The dependency tree enables both ring and aws-lc-rs; rustls cannot
# auto-select a provider then — install the ring one explicitly (see
# ensure_crypto_provider).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
uuid.workspace = true

tokio = { version = "1", features = ["sync", "rt-multi-thread"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[dev-dependencies]
axum.workspace = true
tokio = { version = "1", features = ["test-util"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Console"] }
winreg = "0.55"
