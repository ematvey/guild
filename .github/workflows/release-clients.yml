name: Release clients
on:
  push:
    branches: [develop, master]
  workflow_dispatch:
    inputs:
      version:
        description: Optional stable version override on master; otherwise next patch
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: release-clients-${{ github.ref }}
  cancel-in-progress: false
  queue: max
jobs:
  prepare:
    runs-on: ubuntu-24.04
    environment: ${{ github.ref == 'refs/heads/master' && 'stable-release' || 'develop-release' }}
    permissions:
      contents: write
    outputs:
      skip: ${{ steps.prepare.outputs.skip }}
      channel: ${{ steps.prepare.outputs.channel }}
      version: ${{ steps.prepare.outputs.version }}
      commit: ${{ steps.prepare.outputs.commit }}
      source_ref: ${{ github.ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.RELEASE_PUSH_KEY }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Prepare release version
        id: prepare
        env:
          RELEASE_SIGNING_PUBLIC_KEY: ${{ vars.RELEASE_SIGNING_PUBLIC_KEY }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_PUSH_KEY: ${{ secrets.RELEASE_PUSH_KEY }}
        run: |
          set -euo pipefail
          node --test scripts/release.test.mjs
          if [ "$GITHUB_REF" = refs/heads/master ]; then
            if [ "$GITHUB_EVENT_NAME" = push ] && node scripts/release.mjs is-release-commit HEAD; then
              echo 'skip=true' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo 'channel=stable' >> "$GITHUB_OUTPUT"
            git switch master
            git pull --ff-only origin master
            prior=$(git log --format=%H --grep="^Guild-Release-Run: $GITHUB_RUN_ID$" -1)
            if [ -n "$prior" ] && node scripts/release.mjs is-release-commit "$prior"; then
              git switch --detach "$prior"
              RELEASE_VERSION=$(node scripts/release.mjs version)
              echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
              echo "commit=$prior" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ -z "$RELEASE_VERSION" ]; then RELEASE_VERSION=$(node scripts/release.mjs next-version); fi
            node scripts/release.mjs check-stable "$RELEASE_VERSION"
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            test -n "$RELEASE_PUSH_KEY"
            signing_key="$RUNNER_TEMP/release-signing-key"
            umask 077
            printf '%s\n' "$RELEASE_PUSH_KEY" > "$signing_key"
            trap 'rm -f "$signing_key"' EXIT
            git config gpg.format ssh
            git config user.signingkey "$signing_key"
            git config commit.gpgsign true
            before=$(git rev-parse HEAD)
            scripts/bump-version.sh "$RELEASE_VERSION"
            git add Cargo.toml Cargo.lock apps/desktop/package.json apps/desktop/src-tauri/tauri.conf.json apps/server/package.json packages/ui/package.json package-lock.json
            if ! git diff --cached --quiet; then
              git commit -m "release: version $RELEASE_VERSION" -m "Guild-Release-Run: $GITHUB_RUN_ID"
              node scripts/release.mjs check-policy "$before" HEAD origin/master master
              git push origin HEAD:master
            fi
          else
            echo 'channel=develop' >> "$GITHUB_OUTPUT"
            RELEASE_VERSION=$(node scripts/release.mjs preview-version "$(node -p Date.now\(\))")
          fi
          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  build:
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - platform: linux-x86_64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage
          - platform: darwin-aarch64
            os: macos-15
            target: aarch64-apple-darwin
            bundles: app,dmg
          - platform: darwin-x86_64
            os: macos-15-intel
            target: x86_64-apple-darwin
            bundles: app,dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            !target/**/release/bundle/**
          key: native-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: native-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-
      - name: Install Linux bundle dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev libxdo-dev librsvg2-dev patchelf libasound2-dev lld
      - name: Install dependencies and stamp preview
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          npm ci
          rustup target add '${{ matrix.target }}'
          if [[ "$VERSION" == *-dev.* ]]; then bash scripts/bump-version.sh --build "$VERSION"; fi
          node protocol/check.mjs
      - name: Build signed client
        working-directory: apps/desktop
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_DEFAULT_SERVER_URL: ''
          APPIMAGE_EXTRACT_AND_RUN: '1'
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo 'Configure the existing updater signing key in repository secrets'; exit 1; }
          npm run tauri build -- --target '${{ matrix.target }}' --bundles '${{ matrix.bundles }}'
          while IFS= read -r file; do
            npm run tauri signer sign -- --app-version "$VERSION" "$file"
          done < <(find '../../target/${{ matrix.target }}/release/bundle' -name '*.dmg')
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform }}
          path: |
            target/${{ matrix.target }}/release/bundle/**/*.exe
            target/${{ matrix.target }}/release/bundle/**/*.exe.sig
            target/${{ matrix.target }}/release/bundle/**/*.AppImage
            target/${{ matrix.target }}/release/bundle/**/*.AppImage.sig
            target/${{ matrix.target }}/release/bundle/**/*.dmg
            target/${{ matrix.target }}/release/bundle/**/*.dmg.sig
            target/${{ matrix.target }}/release/bundle/**/*.app.tar.gz
            target/${{ matrix.target }}/release/bundle/**/*.app.tar.gz.sig
          if-no-files-found: error
          retention-days: 3
  publish:
    needs: [prepare, build]
    if: needs.prepare.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/download-artifact@v8
        with:
          path: bundles
      - name: Publish complete release
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          COMMIT: ${{ needs.prepare.outputs.commit }}
          SOURCE_REF: ${{ needs.prepare.outputs.source_ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/release.mjs collect bundles artifacts "$VERSION"
          node scripts/release.mjs assemble artifacts "$VERSION" "$GITHUB_REPOSITORY" "$COMMIT" "$SOURCE_REF"
          node scripts/release.mjs publish artifacts

  sync-develop:
    needs: [prepare, publish]
    if: needs.prepare.outputs.channel == 'stable'
    runs-on: ubuntu-24.04
    environment: stable-release
    permissions:
      contents: write
      pull-requests: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.RELEASE_PUSH_KEY }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Synchronize the released version through a develop PR
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PUSH_KEY: ${{ secrets.RELEASE_PUSH_KEY }}
          RELEASE_SIGNING_PUBLIC_KEY: ${{ vars.RELEASE_SIGNING_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_PUSH_KEY"
          signing_key="$RUNNER_TEMP/sync-signing-key"
          umask 077
          printf '%s\n' "$RELEASE_PUSH_KEY" > "$signing_key"
          trap 'rm -f "$signing_key"' EXIT
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config gpg.format ssh
          git config user.signingkey "$signing_key"
          git config commit.gpgsign true
          git fetch origin master develop
          version=$(node scripts/release.mjs version origin/master)
          if [ "$(node scripts/release.mjs version origin/develop)" = "$version" ]; then exit 0; fi
          branch="sync/client-version-$version"
          if git show-ref --verify --quiet "refs/remotes/origin/$branch"; then
            git switch --track "origin/$branch"
          else
            git switch -c "$branch" origin/develop
            bash scripts/bump-version.sh --sync "$version"
            git add Cargo.toml Cargo.lock apps/desktop/package.json apps/desktop/src-tauri/tauri.conf.json apps/server/package.json packages/ui/package.json package-lock.json
            git commit -m "release: sync version $version from master"
            git push origin "HEAD:$branch"
          fi
          pr=$(gh pr list --head "$branch" --base develop --state open --json url --jq '.[0].url // empty')
          if [ -z "$pr" ]; then
            printf 'Synchronize the stable product version %s from master. Source changes on develop are preserved. Version policy validates this version against master.\n' "$version" > "$RUNNER_TEMP/version-sync.md"
            pr=$(gh pr create --base develop --head "$branch" --title "release: sync version $version" --body-file "$RUNNER_TEMP/version-sync.md")
          fi
          sha=$(git rev-parse HEAD)
          passed=false
          for attempt in $(seq 1 300); do
            conclusion=$(gh run list --workflow version-policy.yml --branch "$branch" --event push --commit "$sha" --json conclusion --jq '.[0].conclusion // empty')
            if [ "$conclusion" = success ]; then passed=true; break; fi
            if [ -n "$conclusion" ]; then echo "Version policy failed: $conclusion" >&2; exit 1; fi
            sleep 2
          done
          if [ "$passed" != true ]; then echo "Timed out waiting for version synchronization checks" >&2; exit 1; fi
          node scripts/release.mjs is-release-commit "$sha"
          git fetch origin master develop
          test "$(git rev-list --parents -n 1 "$sha" | wc -w)" -eq 2
          git merge-base --is-ancestor "$sha^" origin/develop
          node scripts/release.mjs check-policy origin/develop "$sha" origin/master develop
          git switch -c "merge/client-version-$version" origin/develop
          git merge --no-ff "$sha" -m "Merge version synchronization $version"
          # The deploy-key push emits both policy and release workflows.
          git push origin HEAD:develop
