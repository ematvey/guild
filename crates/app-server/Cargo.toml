[package]
name = "guild-app-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ed25519-dalek.workspace = true
sha2.workspace = true
chrono.workspace = true
hex.workspace = true
guild-core = { path = "../guild-core" }
protocol = { path = "../protocol" }
tokio.workspace = true
tokio-util = { version = "0.7", default-features = false, features = ["io-util"] }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
reqwest.workspace = true
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
# The dependency tree enables both ring and aws-lc-rs; rustls cannot
# auto-select a provider then — install the ring one explicitly (see
# ensure_crypto_provider).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
url = "2"
futures.workspace = true
async-trait.workspace = true
async-stream = "0.3"
uuid.workspace = true
dirs = "6"
rmcp = { version = "3.2", features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest"] }

[dev-dependencies]
axum.workspace = true
guild-server = { path = "../server", features = ["test-support"] }
wiremock = "0.6"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Pipes", "Win32_Foundation"] }
