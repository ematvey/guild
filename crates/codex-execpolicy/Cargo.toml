[package]
name = "codex-execpolicy"
version = "0.2.1"
edition = "2024"
license = "Apache-2.0"
description = "Vendored from openai/codex codex-rs/execpolicy: prefix-based Starlark rules for command decisions."

[lib]
name = "codex_execpolicy"
path = "src/lib.rs"
doctest = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
codex-utils-absolute-path = { path = "../codex-utils-absolute-path" }
multimap = "0.10.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shlex = "1.3.0"
starlark = { version = "0.14.2", default-features = false }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt"] }

[dev-dependencies]
pretty_assertions = "1.4.1"
