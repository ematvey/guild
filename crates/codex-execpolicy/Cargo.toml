[package]
name = "codex-execpolicy"
version = "0.2.1"
edition = "2024"
license = "Apache-2.0"
description = "Vendored from openai/codex codex-rs/execpolicy: prefix-based Starlark rules for command decisions."

[lib]
name = "codex_execpolicy"
path = "src/lib.rs"
doctest = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"], optional = true }
codex-utils-absolute-path = { path = "../codex-utils-absolute-path" }
multimap = "0.10.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shlex = "1.3.0"
starlark = { version = "0.14.2", default-features = false, optional = true }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt"], optional = true }

# The Starlark parser pulls `starlark`, which enables
# `serde_json/arbitrary_precision` — a cargo-global feature that breaks
# internally-tagged serde deserialization of numeric fields in EVERY binary
# linking this crate. Runtime consumers (guild-server) therefore build with
# `default-features = false` and get only the evaluation engine; the Starlark
# parser runs at build time via guild-server's build script instead.
[features]
default = ["parser"]
parser = ["dep:starlark", "dep:clap", "dep:tokio"]

[[bin]]
name = "codex-execpolicy"
path = "src/main.rs"
required-features = ["parser"]

[dev-dependencies]
pretty_assertions = "1.4.1"
