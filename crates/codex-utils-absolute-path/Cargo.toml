[package]
name = "codex-utils-absolute-path"
version = "0.2.1"
edition = "2024"
license = "Apache-2.0"
description = "Vendored from openai/codex codex-rs/utils/absolute-path."

[dependencies]
dirs = "6"
dunce = "1.0.4"
schemars = "0.8.22"
serde = { version = "1", features = ["derive"] }
ts-rs = { version = "11", features = ["serde-json-impl", "no-serde-warnings"] }

[lib]
doctest = false

[dev-dependencies]
pretty_assertions = "1.4.1"
tempfile = "3"
serde_json = "1"
