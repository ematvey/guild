[package]
name = "guild-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
base64.workspace = true
protocol = { path = "../protocol" }
guild-core = { path = "../guild-core" }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
axum.workspace = true
tower.workspace = true
tower-http.workspace = true
sqlx.workspace = true
hex.workspace = true
sha2.workspace = true
hmac.workspace = true
subtle.workspace = true
ed25519-dalek.workspace = true
jsonwebtoken.workspace = true
uuid.workspace = true
chrono.workspace = true
argon2.workspace = true
rand.workspace = true
rand_core.workspace = true
aes-gcm.workspace = true
clickhouse = { version = "0.15", features = ["chrono", "uuid", "rustls-tls-webpki-roots"], default-features = false }
async-stream = "0.3"
object_store = { version = "0.14", default-features = false, features = ["aws"] }
include_dir = "0.7"
mime_guess = "2"
tracing-subscriber.workspace = true
tracing.workspace = true
reqwest.workspace = true
restate-sdk = { version = "0.12", features = ["reqwest-client"] }
rmcp = { version = "3.2", features = ["client", "transport-streamable-http-client-reqwest"] }
async-trait.workspace = true
eventsource-stream.workspace = true
regex = "1"
futures.workspace = true
wiremock = { version = "0.6", optional = true }
aws-sdk-s3 = { version = "1", optional = true, default-features = false, features = ["behavior-version-latest", "rt-tokio", "rustls"] }

[dev-dependencies]
wiremock = "0.6"
uuid.workspace = true
# Fixture MCP server for plugin tests (features union with the client dep).
rmcp = { version = "3.2", features = ["server", "transport-streamable-http-server"] }

