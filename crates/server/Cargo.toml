[package]
name = "guild-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
protocol = { path = "../protocol" }
guild-core = { path = "../guild-core" }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
axum.workspace = true
tower.workspace = true
tower-http.workspace = true
sqlx.workspace = true
hex.workspace = true
uuid.workspace = true
chrono.workspace = true
argon2.workspace = true
rand.workspace = true
rand_core.workspace = true
aes-gcm.workspace = true
clickhouse = { version = "0.15", features = ["chrono", "uuid", "rustls-tls-webpki-roots"], default-features = false }
async-stream = "0.3"
tracing = "0.1"
futures.workspace = true
wiremock = { version = "0.6", optional = true }
testcontainers = { workspace = true, optional = true }
testcontainers-modules = { workspace = true, optional = true }

[dev-dependencies]
testcontainers-modules.workspace = true
wiremock = "0.6"
tracing-subscriber = "0.3"

[[test]]
name = "http_scaffold"
required-features = ["test-support"]

[[test]]
name = "auth_api"
required-features = ["test-support"]

[[test]]
name = "gateway_api"
required-features = ["test-support"]


[features]
test-support = ["dep:testcontainers", "dep:testcontainers-modules", "dep:wiremock"]
