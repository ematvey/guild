[package]
name = "guild-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
protocol = { path = "../protocol" }
guild-core = { path = "../guild-core" }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
axum.workspace = true
tower.workspace = true
tower-http.workspace = true
sqlx.workspace = true
hex.workspace = true
sha2.workspace = true
hmac.workspace = true
ed25519-dalek.workspace = true
jsonwebtoken.workspace = true
uuid.workspace = true
chrono.workspace = true
argon2.workspace = true
rand.workspace = true
rand_core.workspace = true
aes-gcm.workspace = true
clickhouse = { version = "0.15", features = ["chrono", "uuid", "rustls-tls-webpki-roots"], default-features = false }
async-stream = "0.3"
object_store = { version = "0.14", default-features = false, features = ["aws"] }
include_dir = "0.7"
mime_guess = "2"
tracing-subscriber.workspace = true
tracing.workspace = true
reqwest.workspace = true
restate-sdk = { version = "0.12", features = ["reqwest-client"] }
async-trait.workspace = true
eventsource-stream.workspace = true
futures.workspace = true
wiremock = { version = "0.6", optional = true }
testcontainers = { workspace = true, optional = true }
aws-sdk-s3 = { version = "1", optional = true, default-features = false, features = ["behavior-version-latest", "rt-tokio", "rustls"] }
testcontainers-modules = { workspace = true, optional = true }

[dev-dependencies]
testcontainers-modules.workspace = true
wiremock = "0.6"

[[test]]
name = "http_scaffold"
required-features = ["test-support"]

[[test]]
name = "auth_api"
required-features = ["test-support"]

[[test]]
name = "gateway_api"
required-features = ["test-support"]

[[test]]
name = "chats_api"
required-features = ["test-support"]

[[test]]
name = "gateway_tools"
required-features = ["test-support"]

[[test]]
name = "s3_store"
required-features = ["test-support"]

[[test]]
name = "registry_api"
required-features = ["test-support"]

[[test]]
name = "admin_api"
required-features = ["test-support"]

[[test]]
name = "usage_api"
required-features = ["test-support"]

[[test]]
name = "webui_serving"
required-features = ["test-support"]

[[test]]
name = "routines_api"
required-features = ["test-support"]

[[test]]
name = "executor"
required-features = ["test-support"]

[[test]]
name = "api_keys"
required-features = ["test-support"]

[[test]]
name = "openai_api"
required-features = ["test-support"]

[[test]]
name = "agents_api"
required-features = ["test-support"]

[[test]]
name = "oidc_api"
required-features = ["test-support"]

[[test]]
name = "quota_api"
required-features = ["test-support"]

[[test]]
name = "attachments_api"
required-features = ["test-support"]

[[test]]
name = "integration_install"
required-features = ["test-support"]

[[test]]
name = "events_api"
required-features = ["test-support"]

[[test]]
name = "releases_api"
